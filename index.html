*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;font-family:inherit;font-synthesis:none}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:16px;line-height:1.45;color:var(--tx);background:var(--bgc)}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
/* wallpaper behind every section */
#wall{position:fixed;inset:0;z-index:0;background:var(--bgc) var(--wall) center/cover no-repeat}
.scr{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;height:100vh;height:100dvh}
.scr.on{display:flex}
#cv,#pv{position:fixed;inset:0;display:none;flex-direction:column;height:100vh;height:100dvh;background:var(--bgc) var(--wall) center/cover no-repeat}
#cv{z-index:30}#pv{z-index:40}
#cv.on,#pv.on{display:flex}
/* icons: transparent PNG, no background colour */
.ti,.lic,.logo{display:block;flex:none;background-color:transparent;background-position:center;background-repeat:no-repeat;background-size:contain}
.i-chat{background-image:var(--ic-chat)}.i-post{background-image:var(--ic-post)}.i-noti{background-image:var(--ic-noti)}.i-me{background-image:var(--ic-me)}.i-bot{background-image:var(--ic-bot)}
.ti{width:30px;height:30px;opacity:.55}.lic{width:36px;height:36px}.logo{width:64px;height:64px;margin-bottom:22px}
.dot{width:22px;height:22px;flex:none;background:var(--arrow) center/contain no-repeat}
/* text frame image (inputs) */
.in,.cin input{border:2px solid transparent;border-image-source:var(--inimg);border-image-slice:4 fill;border-image-width:2px;border-image-repeat:stretch;background:none;color:var(--intx);outline:0}
.in{width:100%;height:46px;padding:0 12px}
textarea.in{padding:10px 12px;height:90px;resize:none}
.in::placeholder,.cin input::placeholder,.rin::placeholder{color:var(--ph)}.in[readonly]{opacity:.7}
.btn{height:44px;border-radius:2px;background:var(--btn);color:var(--btnt);border:1px solid rgba(255,255,255,.5)}.btn:disabled{opacity:.55}
.chip{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:var(--glass);color:var(--st);white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btnt)}.chip.s{height:28px;padding:0 10px;font-size:13px}
#login{align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:320px;display:grid;gap:12px}
#err{color:var(--red);font-size:14px;min-height:20px;text-align:center}
.top{height:calc(env(safe-area-inset-top) + 6px);flex:none}
.pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pg{display:none}.pg.on{display:block}
.tabbar{flex:none;display:flex;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;color:var(--sub)}
.tabbar .on{color:var(--st)}.tabbar .on .ti{opacity:1}
.num{color:var(--sub);font-size:13px}.empty{padding:40px;text-align:center;color:var(--sub)}
.av{width:46px;height:46px;border-radius:6px;background:rgba(128,128,128,.25) center/cover no-repeat;display:grid;place-items:center;color:var(--st);font-weight:600;flex:none}
.card{margin:10px 12px;padding:14px 16px;border:1px solid var(--line);background:var(--glass)}
.card h3{font-size:15px;color:var(--st);margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center}.row .in{flex:1;min-width:0;width:auto}
.cm{font-size:15px;word-break:break-word}.cm b{color:var(--st);margin-right:6px;cursor:pointer}.cm a{color:var(--red);margin-left:8px;font-size:13px;cursor:pointer}
.ok{color:var(--sub);font-size:14px;min-height:20px;text-align:center;margin-top:6px}
.fld{display:grid;gap:4px;margin-top:12px}.fld>*,.row{min-width:0}.row small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fld small{color:var(--sub);font-size:13px}
/* chats list */
#cl .row{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.rt{min-width:0}.nm{color:var(--st);font-size:17px}.pv{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* conversation */
.ch{flex:none;position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);color:var(--st)}
.bk{position:absolute;left:10px;bottom:3px;height:40px;width:40px;font-size:34px;line-height:36px;color:var(--st)}
#cm{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;align-items:flex-start;max-width:100%}.m.me{flex-direction:row-reverse}
.mav{width:40px;height:40px;border-radius:8px;flex:none;background:rgba(128,128,128,.25) center/cover no-repeat;display:grid;place-items:center;color:var(--st);font-size:15px;cursor:pointer}
.mc{display:flex;flex-direction:column;align-items:flex-start;max-width:72%;min-width:0}.m.me .mc{align-items:flex-end}
/* bubble frames from the theme */
.b{width:fit-content;max-width:100%;padding:9px 13px;border:1px solid transparent;border-image-source:var(--b-recv);border-image-slice:2 fill;border-image-width:1px;border-image-repeat:stretch;color:#f2f2f2;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .b{border-image-source:var(--b-me);color:#333}
.b a{color:inherit;text-decoration:underline}
.b.aa{border:0;border-image:none;min-width:210px;padding:16px 18px;background:var(--aa) center/100% 100% no-repeat;color:var(--intx)}
.stp{align-self:center;color:var(--sub);font-size:13px;margin:4px 0}
.x{display:none;margin-top:4px;font-size:13px;color:var(--red)}.m.sel .x{display:block}
#cerr{flex:none;color:var(--red);font-size:13px;text-align:center}
.cin{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.cin[hidden]{display:none}
.cin input{flex:1;min-width:0;height:42px;padding:0 12px}
.cin button{height:42px;padding:0 16px;border:1px solid transparent;border-image-source:var(--b-me);border-image-slice:2 fill;border-image-width:1px;color:#333}
/* Post feed */
.newbar{padding:10px 12px;border-bottom:1px solid var(--line)}
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.pstH{display:flex;align-items:center;gap:10px;padding:10px 12px}
.pstH .av{width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer}
.pstH b{color:var(--st);font-size:15px;font-weight:600;cursor:pointer}.pstH .chip{margin-left:auto}
.pic{display:block;width:100%}
.act{display:flex;gap:16px;padding:10px 12px 2px}
.act button{display:flex;color:var(--st)}
.act svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.act .on svg{fill:var(--red);stroke:var(--red)}
.lk{padding:2px 12px;color:var(--st);font-weight:600;font-size:15px}
.cap{padding:2px 12px;color:var(--st);word-break:break-word}.cap b{margin-right:6px}
.cms{padding:4px 12px 0;display:grid;gap:4px}.more{color:var(--sub);font-size:14px;cursor:pointer}
.add{display:flex;gap:8px;padding:8px 12px 0}.add .in{height:40px}.add button{padding:0 12px;color:var(--st);font-weight:600}
/* Me */
.meT{display:grid;justify-items:center;gap:2px;padding:22px 16px 14px}
.meav{width:96px;height:96px;border-radius:16px;background:rgba(128,128,128,.25) center/cover no-repeat;display:grid;place-items:center;font-size:38px;color:var(--st);font-weight:600;margin-bottom:8px;cursor:pointer}
.meT .nm{font-size:20px}
.li{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.rin{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--st);font-size:16px;padding:0;word-break:break-word}
.sub{padding:4px 16px 14px}
.seg{display:flex;gap:8px;margin:8px 0 14px}.seg .chip{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.th{width:44px;height:44px;object-fit:cover;flex:none}
/* profile of another user */
.pvb{display:grid;justify-items:center;gap:4px;padding:30px 24px;text-align:center}
.pvb .bio{margin-top:10px;color:var(--st);white-space:pre-wrap;word-break:break-word}
</style></head><body>
<div id="wall"></div>

<section id="login" class="scr on">
 <i class="logo i-bot"></i>
 <form id="lf">
  <input class="in" id="u" placeholder="Username" autocomplete="username" autocapitalize="none" required>
  <input class="in" id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <div id="err"></div>
  <button class="btn" id="lb">Sign in</button>
 </form>
</section>

   <div class="li" id="lfav"><i class="lic i-post"></i><span class="rin">Favourite</span><i class="dot"></i></div>

 const av=e.target.closest('.mav[data-u]');if(av){showProfile(av.dataset.u);return}
 if(e.target.closest('a'))return;const m=e.target.closest('.m');if(!m)return;
 sel=sel===m.dataset.k?null:m.dataset.k;
 document.querySelectorAll('#cm .m').forEach(n=>n.classList.toggle('sel',n.dataset.k===sel))};
async function delMsg(k){
 if(!confirm('Delete this message?'))return;const id=+k.slice(1);sel=null;
 if(k[0]==='b'){bm=bm.filter(m=>m.k!==k);draw(bm);return}
 const q=k[0]==='d'?sb.from('messages'):sb.from('notices');
 const {data,error}=await q.delete().eq('id',id).select('id');
 if(error||!data||!data.length){err('Could not delete');return}
 lastSig='';k[0]==='d'?loadDM():loadN()}
$('#cf').onsubmit=async e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v||!cv)return;$('#ci').value='';
 if(cv.id==='bot'){botSay(v);return}
 if(cv.id.startsWith('dm:')){
  const r=await sb.from('messages').insert({user_id:cv.id.slice(3),sender_id:me.id,body:v});
  if(r.error){$('#ci').value=v;err('Could not send');return}lastSig='';loadDM()}};
async function botSay(v){
 bm.push({k:'b'+(++bn),me:1,t:v,at:Date.now(),del:1});draw(bm);
 const {data,error}=await sb.rpc('claim_code',{p_pw:v});
 if(error){err('Could not check. Try again.');return}
 const r=data||{},bot=(t,l)=>bm.push({k:'b'+(++bn),t,link:l,at:Date.now(),img:IC_BOT,uid:'',del:1});
 if(r.status==='ok')bot(r.link,r.link);
 else if(r.status==='locked')bot('Locked for '+r.minutes+' min');
 draw(bm)}

/* ---------- Noti (owner) ---------- */
const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<90?'now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':new Date(t).toLocaleDateString()};
async function noti(){
 if(me.role!=='owner')return;
 const [n,u,a]=await Promise.all([
  sb.from('notices').select('id,body,created_at').order('created_at',{ascending:false}),
  sb.from('profiles').select('id,username,display_name,role,banned,last_seen').order('created_at'),
  sb.from('activity').select('user_id,kind,ref,created_at').order('created_at',{ascending:false}).limit(30)]);
 const U=u.data||[],N={};U.forEach(p=>N[p.id]=p.display_name+' (@'+p.username+')');
 $('#nlist').innerHTML=(n.data||[]).map(x=>`<div class="cm">${esc(x.body).replace(/\n/g,'<br>')}<div class="num">${ago(x.created_at)} <a data-k="dn" data-i="${x.id}">Delete</a></div></div>`).join('');
 const on=U.filter(p=>!p.banned&&Date.now()-new Date(p.last_seen)<120000);
 $('#onl').innerHTML=on.map(p=>`<div data-k="pf" data-i="${p.id}" style="cursor:pointer">\u25cf ${esc(p.display_name)} <span class="num">@${esc(p.username)}</span></div>`).join('')||'<span class="num">Nobody</span>';
 $('#ulist').innerHTML=U.filter(p=>p.role!=='owner').map(p=>`<div class="row" style="margin-bottom:8px"><div data-k="pf" data-i="${p.id}" style="flex:1;min-width:0;cursor:pointer"><b>${esc(p.display_name)}</b><div class="num">@${esc(p.username)}${p.banned?' \u00b7 blocked':''}</div></div><button class="chip" data-k="ban" data-i="${p.id}" data-b="${p.banned?0:1}">${p.banned?'Unblock':'Kick'}</button><button class="chip" data-k="rs" data-i="${p.id}">Free name</button></div>`).join('')||'<span class="num">No users yet</span>';
 const K={signin:'signed in',like:'liked',comment:'commented on',message:'sent a DM',file:'got the file of'};
 $('#alist').innerHTML=(a.data||[]).map(x=>`<div class="cm">${esc(N[x.user_id]||'?')} ${K[x.kind]||esc(x.kind)}${x.ref?' a post':''} <span class="num">${ago(x.created_at)}</span></div>`).join('')||'<span class="num">Nothing yet</span>'}
$('#p3').onclick=async e=>{const t=e.target.closest('[data-k],#nb');if(!t)return;
 if(t.dataset.k==='pf'){showProfile(t.dataset.i);return}
 if(t.id==='nb'){const v=$('#nt').value.trim();if(!v)return;const r=await sb.from('notices').insert({body:v});if(!r.error)$('#nt').value=''}
 else if(t.dataset.k==='dn'){if(!confirm('Delete this notice?'))return;await sb.from('notices').delete().eq('id',+t.dataset.i)}
 else if(t.dataset.k==='ban'){const ban=t.dataset.b==='1';if(ban&&!confirm('Kick this user?'))return;await sb.rpc('set_banned',{p_uid:t.dataset.i,p_banned:ban})}
 else if(t.dataset.k==='rs'){if(!confirm('Free this username so it can be claimed again?'))return;await sb.rpc('reset_username',{p_uid:t.dataset.i})}
 noti()};
setInterval(()=>{if($('#p3').classList.contains('on'))noti()},15000);

boot();
</script></body></html>
