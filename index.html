*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body,button,input,textarea{font-family:Xia,-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
body{font-size:16px;line-height:1.45;color:var(--tx);background:var(--bg)}
button{border:0;background:none;cursor:pointer;color:inherit;font-size:inherit}
.scr{position:fixed;inset:0;display:none;flex-direction:column;height:100vh;height:100dvh}
.scr.on{display:flex}
#login{align-items:center;justify-content:center;padding:24px;background:var(--bg) var(--chatbg) center/cover}
#login img{width:60px;height:60px;border-radius:14px;margin-bottom:22px}
#login form{width:100%;max-width:320px;display:grid;gap:12px}
.in{width:100%;height:44px;padding:0 14px;border:1px solid #fff;border-radius:4px;background:var(--inbg);color:var(--st);outline:0}
textarea.in{padding:10px 14px;height:84px;resize:none}
.in::placeholder{color:#a8a3a6}.in[readonly]{opacity:.7}
.btn{height:44px;border-radius:4px;background:var(--btn);color:var(--btnt)}.btn:disabled{opacity:.55}
.chip{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--st)}
.chip.on{background:var(--btn);color:var(--btnt)}
.chip.s{height:28px;padding:0 10px;font-size:13px}
#err{color:var(--red);font-size:14px;min-height:20px;text-align:center}
.top{height:calc(env(safe-area-inset-top) + 6px);background:var(--bg);flex:none}
.pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--pg)}
.pg{display:none}.pg.on{display:block}
.tabbar{flex:none;display:flex;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;color:#9a9a9a}
.tabbar button[hidden]{display:none}
.ti{display:block;width:28px;height:28px;border-radius:7px;background:center/cover no-repeat;opacity:.5}
.tabbar .on{color:var(--st);background:var(--sel)}.tabbar .on .ti{opacity:1}
.num{color:var(--sub);font-size:13px}.empty{padding:40px;text-align:center;color:var(--sub)}
.av{width:46px;height:46px;border-radius:6px;background:var(--bub) center/cover no-repeat;display:grid;place-items:center;color:var(--sub);font-weight:600;flex:none}
.card{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.card h3{font-size:15px;color:var(--st);margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center}
.cm{font-size:15px;word-break:break-word}.cm b{color:var(--st);margin-right:6px}.cm a{color:var(--red);margin-left:8px;font-size:13px;cursor:pointer}
.ok{color:var(--sub);font-size:14px;min-height:20px;text-align:center;margin-top:6px}
.fld{display:grid;gap:4px;margin-top:12px}.fld small{color:var(--sub);font-size:13px}
/* chats list */
#cl .row{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.rt{min-width:0}.nm{color:var(--st);font-size:17px}.pv{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* conversation: full screen, hides tab bar and header */
#cv{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;height:100vh;height:100dvh;background:var(--bg) var(--chatbg) center/cover}
#cv.on{display:flex}
.ch{flex:none;position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--line);color:var(--st)}
#cb{position:absolute;left:10px;bottom:5px;height:36px;width:36px;border-radius:50%;background:var(--sel);font-size:26px;line-height:34px;color:var(--st)}
#cm{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;align-items:flex-start;max-width:100%}.m.me{flex-direction:row-reverse}
.mav{width:40px;height:40px;border-radius:8px;flex:none;background:var(--bub) center/cover no-repeat;display:grid;place-items:center;color:var(--sub);font-size:15px}
.mc{display:flex;flex-direction:column;align-items:flex-start;max-width:72%;min-width:0}.m.me .mc{align-items:flex-end}
.b{width:fit-content;max-width:100%;padding:8px 12px;border:1px solid #fff;border-radius:4px;background:var(--bub);color:var(--bubt);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .b{background:var(--me);color:var(--met)}.b a{color:inherit;text-decoration:underline}
.stp{align-self:center;color:var(--sub);font-size:13px;margin:4px 0}
.x{display:none;margin-top:4px;font-size:13px;color:var(--red)}.m.sel .x{display:block}
#cerr{flex:none;color:var(--red);font-size:13px;text-align:center}
.cin{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.cin[hidden]{display:none}
.cin input{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid #fff;border-radius:4px;background:var(--inbg);color:var(--st);outline:0}
.cin button{height:40px;padding:0 16px;border-radius:4px;background:var(--btn);color:var(--btnt)}
/* Post feed (instagram style) */
.newbar{padding:10px 12px;border-bottom:1px solid var(--line)}.newbar[hidden],#pform[hidden]{display:none}
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.pstH{display:flex;align-items:center;gap:10px;padding:10px 12px}
.pstH .av{width:34px;height:34px;border-radius:50%;font-size:14px}
.pstH b{color:var(--st);font-size:15px;font-weight:600}.pstH .num{margin-left:auto}
.pic{display:block;width:100%;background:#f3f3f3}
.act{display:flex;gap:16px;padding:10px 12px 2px}
.act button{display:flex;color:var(--st)}
.act svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.act .on svg{fill:var(--red);stroke:var(--red)}
.lk{padding:2px 12px;color:var(--st);font-weight:600;font-size:15px}
.cap{padding:2px 12px;color:var(--st);word-break:break-word}.cap b{margin-right:6px}
.cms{padding:4px 12px 0;display:grid;gap:4px}.more{color:var(--sub);font-size:14px;cursor:pointer}
.add{display:flex;gap:8px;padding:8px 12px 0}.add .in{height:38px}.add button{padding:0 12px;color:var(--st);font-weight:600}
/* Me */
.meT{display:grid;justify-items:center;gap:2px;padding:22px 16px 18px}
.meav{width:96px;height:96px;border-radius:16px;background:var(--bub) center/cover no-repeat;display:grid;place-items:center;font-size:38px;color:var(--sub);font-weight:600;margin-bottom:8px;cursor:pointer}
.meT .nm{font-size:20px}
.li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.lic{width:34px;height:34px;border-radius:8px;flex:none;background:#4a4a4a center/cover no-repeat}
.rin{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--st);font-size:16px;padding:0}
.rin::placeholder{color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--st);opacity:.85;flex:none}
#setp{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}#setp[hidden]{display:none}
.seg{display:flex;gap:8px;margin:8px 0 14px}.seg .chip{flex:1}
</style></head><body>

const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg>';
const CMT='<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-11.6 7.1L4 20l1-4.2A8 8 0 1120 12z"/></svg>';
let me=null,hb=null;const open=new Set();
const avHTML=(u,n)=>`<div class="av"${u?` style="background-image:url('${esc(u)}')"`:''}>${u?'':esc((n||'?')[0].toUpperCase())}</div>`;

function jpeg(f,max,sq){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{
 let sx=0,sy=0,sw=im.width,sh=im.height;if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
 const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
 c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Image error')),'image/jpeg',.82)};
 im.onerror=()=>no(new Error('Cannot read image'));im.src=URL.createObjectURL(f)})}

/* ---------- login ---------- */
$('#lf').onsubmit=async e=>{e.preventDefault();
 const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;$('#err').textContent='';$('#lb').disabled=true;
 try{
  const r=await fetch(SB_URL+'/functions/v1/login',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},
   body:JSON.stringify({username:u,password:p,key:localStorage.getItem('fbk_'+u)||''})});
  const j=await r.json();
  if(!r.ok){$('#err').textContent=j.error||'Sign in failed';return}
  if(j.key)localStorage.setItem('fbk_'+u,j.key);
  const {error}=await sb.auth.verifyOtp({token_hash:j.token_hash,type:'email'});
  if(error){$('#err').textContent='Sign in failed';return}
  $('#p').value='';await boot();
 }catch(x){$('#err').textContent='Network error. Try again.'}
 finally{$('#lb').disabled=false}};
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){go('login');return}
 const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(!p||p.banned){await sb.auth.signOut();go('login');$('#err').textContent='This account is blocked';return}
 me=p;drawMe();$('#mtab').hidden=p.role!=='owner';$('#newbar').hidden=p.role!=='owner';
 go('app');chats();beat();clearInterval(hb);hb=setInterval(beat,60000)}
function go(id){['login','app'].forEach(x=>$('#'+x).classList.toggle('on',x===id))}
async function beat(){
 const {data}=await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id).select('id');
 if(!data||!data.length){await sb.auth.signOut();location.reload()}}

/* ---------- Me ---------- */
function drawMe(){$('#pn').value=me.display_name;$('#bio').value=me.bio||'';$('#mnm').textContent=me.display_name;$('#mun').textContent='@'+me.username;$('#pu').textContent='@'+me.username;
 const a=$('#pav');a.style.backgroundImage=me.avatar_url?`url('${me.avatar_url}')`:'';a.textContent=me.avatar_url?'':me.display_name[0].toUpperCase()}
async function saveField(f,v,msg){const {error}=await sb.from('profiles').update({[f]:v}).eq('id',me.id);
 if(error){$('#ok').textContent=msg||'Could not save';return false}me[f]=v;drawMe();$('#ok').textContent='Saved';return true}
$('#pn').onchange=()=>{const v=$('#pn').value.trim();if(!v){$('#ok').textContent='Name cannot be empty';$('#pn').value=me.display_name;return}saveField('display_name',v)};
$('#bio').onchange=()=>saveField('bio',$('#bio').value.trim()||null,'Could not save bio (run update-3.sql)');
$('#lph').onclick=$('#pav').onclick=()=>$('#pf').click();
$('#lset').onclick=()=>{$('#setp').hidden=!$('#setp').hidden};
function segs(){const m=localStorage.getItem('fbt')||'auto';document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===m))}
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{localStorage.setItem('fbt',b.dataset.th);applyTheme();segs()});segs();
$('#lo').onclick=()=>sb.auth.signOut().then(()=>location.reload());
$('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#ok').textContent='Uploading...';
 try{const b=await jpeg(f,240,true),path=me.id+'/a.jpg';
  const u=await sb.storage.from('avatars').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(u.error)throw u.error;
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const r=await sb.from('profiles').update({avatar_url:url}).eq('id',me.id);if(r.error)throw r.error;
  me.avatar_url=url;drawMe();$('#ok').textContent='Photo updated'}catch(x){$('#ok').textContent='Upload failed'}};

/* ---------- tabs ---------- */
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;
 document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.pg').forEach((p,i)=>p.classList.toggle('on',i===t));
 if(t===1)load();if(t===2)chats();if(t===3)noti()});

/* ---------- Post (instagram style) ---------- */
async function load(){
 const [a,b,c,d]=await Promise.all([
  sb.from('posts').select('*').order('no',{ascending:false}),
  sb.from('likes').select('post_no,user_id'),
  sb.from('comments').select('id,post_no,user_id,body').order('created_at'),
  sb.from('profiles').select('id,display_name,avatar_url,role')]);
 const P={};(d.data||[]).forEach(p=>P[p.id]=p.display_name);const ow=(d.data||[]).find(p=>p.role==='owner')||{},isO=me.role==='owner';
 $('#plist').innerHTML=(a.data||[]).map(p=>{
  const L=(b.data||[]).filter(x=>x.post_no===p.no),mine=L.some(x=>x.user_id===me.id),C=(c.data||[]).filter(x=>x.post_no===p.no),o=open.has(p.no);
  return `<article class="post"><div class="pstH">${avHTML(ow.avatar_url,ow.display_name)}<b>${esc(ow.display_name||'')}</b><span class="num">No. ${p.no}</span>${isO?`<button class="chip s" data-a="del" data-n="${p.no}">Delete</button>`:''}</div>
  ${p.image_path?`<img class="pic" src="${esc(pub(p.image_path))}" alt="" loading="lazy">`:''}
  <div class="act"><button class="${mine?'on':''}" data-a="like" data-n="${p.no}">${HEART}</button><button data-a="cm" data-n="${p.no}">${CMT}</button></div>
  <div class="lk">${L.length} likes</div>
  <div class="cap"><b>${esc(ow.display_name||'')}</b>${esc(p.title)}</div>
  ${o?`<div class="cms">${C.map(x=>`<div class="cm"><b>${esc(P[x.user_id]||'?')}</b>${esc(x.body)}${x.user_id===me.id||isO?`<a data-a="dc" data-i="${x.id}">delete</a>`:''}</div>`).join('')}</div>
  <div class="add"><input class="in" id="ci${p.no}" maxlength="500" placeholder="Add a comment"><button data-a="sc" data-n="${p.no}">Post</button></div>`
  :(C.length?`<div class="cms"><a class="more" data-a="cm" data-n="${p.no}">View all ${C.length} comments</a></div>`:'')}</article>`
 }).join('')||'<p class="empty">No posts yet</p>'}
$('#plist').onclick=async e=>{const t=e.target.closest('[data-a]');if(!t)return;const n=+t.dataset.n,a=t.dataset.a;
 if(a==='cm'){open.has(n)?open.delete(n):open.add(n)}
 else if(a==='like'){await(t.classList.contains('on')?sb.from('likes').delete().eq('post_no',n).eq('user_id',me.id):sb.from('likes').insert({post_no:n,user_id:me.id}))}
 else if(a==='sc'){const v=$('#ci'+n).value.trim();if(!v)return;await sb.from('comments').insert({post_no:n,user_id:me.id,body:v})}
 else if(a==='dc'){await sb.from('comments').delete().eq('id',+t.dataset.i)}
 else if(a==='del'){if(!confirm('Delete post '+n+'?'))return;
  const {data}=await sb.from('posts').select('image_path').eq('no',n).maybeSingle();
  if(data&&data.image_path)await sb.storage.from('posts').remove([data.image_path]);
  await sb.from('posts').delete().eq('no',n)}
 load()};
$('#nt0').onclick=()=>{$('#pform').hidden=!$('#pform').hidden};
$('#npb').onclick=async()=>{const t=$('#nti').value.trim(),f=$('#nim').files[0],pw=$('#npw').value,l=$('#nl').value.trim();
 if(!t||!pw||!l){$('#nok').textContent='Title, password and link are required';return}
 $('#npb').disabled=true;$('#nok').textContent='Posting...';
 try{let path=null;
  if(f){const b=await jpeg(f,1080,false);path=Date.now()+'.jpg';
   const u=await sb.storage.from('posts').upload(path,b,{contentType:'image/jpeg'});if(u.error)throw u.error}
  const {data,error}=await sb.from('posts').insert({title:t,image_path:path}).select('no').single();if(error)throw error;
  const r=await sb.rpc('set_post_secret',{p_no:data.no,p_pw:pw,p_link:l});
  if(r.error){await sb.from('posts').delete().eq('no',data.no);throw r.error}
  ['#nti','#npw','#nl'].forEach(s=>$(s).value='');$('#nim').value='';$('#nok').textContent='';$('#pform').hidden=true;load();
 }catch(x){$('#nok').textContent='Failed: '+(x.message||'error')}
 $('#npb').disabled=false};

/* ---------- Chats ---------- */
let cv=null,cvT=null,sel=null,bm=[],bn=0,lastN=-1,lastSig='',ownerP=null;
async function chats(){
 closeC();
 const rows=[{id:'bot',name:BOT,img:IC_BOT},{id:'not',name:'Notices',img:IC_NOT}];
 const {data:op}=await sb.from('profiles').select('display_name,avatar_url').eq('role','owner').maybeSingle();ownerP=op||{};
 if(me.role==='owner'){
  const [a,b]=await Promise.all([sb.from('messages').select('user_id,body').order('created_at',{ascending:false}),sb.from('profiles').select('id,display_name,avatar_url')]);
  const N={};(b.data||[]).forEach(p=>N[p.id]=p);const seen=new Set();
  (a.data||[]).forEach(m=>{if(seen.has(m.user_id))return;seen.add(m.user_id);const p=N[m.user_id]||{};rows.push({id:'dm:'+m.user_id,name:p.display_name||'?',img:p.avatar_url,pv:m.body.slice(0,40)})});
 }else rows.push({id:'dm:'+me.id,name:ownerP.display_name||'Owner',img:ownerP.avatar_url});
 $('#cl').innerHTML=rows.map(r=>`<div class="row" data-c="${esc(r.id)}" data-n="${esc(r.name)}" data-i="${esc(r.img||'')}">${avHTML(r.img,r.name)}<div class="rt"><div class="nm">${esc(r.name)}</div>${r.pv?`<div class="pv">${esc(r.pv)}</div>`:''}</div></div>`).join('')}
$('#cl').onclick=e=>{const t=e.target.closest('[data-c]');if(t)openC(t.dataset.c,t.dataset.n,t.dataset.i)};
$('#cb').onclick=chats;
function openC(id,name,img){
 cv={id,name,img:img||null};sel=null;lastN=-1;lastSig='';$('#cn').textContent=name;$('#cerr').textContent='';$('#cm').innerHTML='';
 $('#cv').classList.add('on');$('#cf').hidden=id==='not';
 if(id==='bot'){bm=[];draw([])}else if(id==='not')loadN();else{loadDM();cvT=setInterval(loadDM,4000)}}
function closeC(){cv=null;clearInterval(cvT);$('#cv').classList.remove('on')}
function err(t){$('#cerr').textContent=t;setTimeout(()=>{$('#cerr').textContent=''},3000)}
const linkHTML=l=>/^https?:\/\//i.test(l)?`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`:esc(l);
function stamp(ms){const d=new Date(ms),t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}),days=(Date.now()-ms)/864e5;
 return days<1&&d.getDate()===new Date().getDate()?t:days<6?d.toLocaleDateString('en',{weekday:'short'})+' '+t:d.toLocaleDateString()+' '+t}
function draw(list){const box=$('#cm');let prev=0;
 const peer=cv?cv.img:null,pn=cv?cv.name:'';
 box.innerHTML=list.map(m=>{
  const s=m.at&&m.at-prev>6e5?`<div class="stp">${esc(stamp(m.at))}</div>`:'';if(m.at)prev=m.at;
  const img=m.me?me.avatar_url:(m.img!==undefined?m.img:peer),nm=m.me?me.display_name:pn;
  return s+`<div class="m${m.me?' me':''}${sel===m.k?' sel':''}" data-k="${m.k}"><div class="mav"${img?` style="background-image:url('${esc(img)}')"`:''}>${img?'':esc((nm||'?')[0].toUpperCase())}</div><div class="mc"><div class="b">${m.link?linkHTML(m.link):esc(m.t)}</div>${m.del?`<button class="x" data-k="${m.k}">Delete</button>`:''}</div></div>`}).join('');
 if(list.length!==lastN){box.scrollTop=box.scrollHeight;lastN=list.length}}
async function loadDM(){if(!cv||!cv.id.startsWith('dm:'))return;const id=cv.id;
 const {data,error}=await sb.from('messages').select('id,sender_id,body,created_at').eq('user_id',id.slice(3)).order('created_at');
 if(!cv||cv.id!==id||error)return;const sig=(data||[]).map(m=>m.id).join(',');if(sig===lastSig)return;lastSig=sig;
 draw((data||[]).map(m=>({k:'d'+m.id,me:m.sender_id===me.id,t:m.body,at:+new Date(m.created_at),del:m.sender_id===me.id||me.role==='owner'})))}
async function loadN(){const {data}=await sb.from('notices').select('id,body,created_at').order('created_at');
 draw((data||[]).map(m=>({k:'n'+m.id,t:m.body,at:+new Date(m.created_at),img:ownerP&&ownerP.avatar_url||null,del:me.role==='owner'})))}
$('#cm').onclick=async e=>{
 const x=e.target.closest('.x');if(x){delMsg(x.dataset.k);return}
 if(e.target.closest('a'))return;const m=e.target.closest('.m');if(!m)return;
 sel=sel===m.dataset.k?null:m.dataset.k;
 document.querySelectorAll('#cm .m').forEach(n=>n.classList.toggle('sel',n.dataset.k===sel))};
async function delMsg(k){
 if(!confirm('Delete this message?'))return;const id=+k.slice(1);sel=null;
 if(k[0]==='b'){bm=bm.filter(m=>m.k!==k);draw(bm);return}
 const q=k[0]==='d'?sb.from('messages'):sb.from('notices');
 const {data,error}=await q.delete().eq('id',id).select('id');
 if(error||!data||!data.length){err('Could not delete');return}
 lastSig='';k[0]==='d'?loadDM():loadN()}
$('#cf').onsubmit=async e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v||!cv)return;$('#ci').value='';
 if(cv.id==='bot'){botSay(v);return}
 if(cv.id.startsWith('dm:')){
  const r=await sb.from('messages').insert({user_id:cv.id.slice(3),sender_id:me.id,body:v});
  if(r.error){$('#ci').value=v;err('Could not send');return}lastSig='';loadDM()}};
async function botSay(v){
 bm.push({k:'b'+(++bn),me:1,t:v,at:Date.now(),del:1});draw(bm);
 const {data,error}=await sb.rpc('claim_code',{p_pw:v});
 if(error){err('Could not check. Try again.');return}
 const r=data||{},bot=(t,l)=>bm.push({k:'b'+(++bn),t,link:l,at:Date.now(),img:IC_BOT,del:1});
 if(r.status==='ok')bot(r.link,r.link);
 else if(r.status==='locked')bot('Locked for '+r.minutes+' min');
 draw(bm)}

/* ---------- Noti (owner) ---------- */
const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<90?'now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':new Date(t).toLocaleDateString()};
async function noti(){
 if(me.role!=='owner')return;
 const [n,u,a]=await Promise.all([
  sb.from('notices').select('id,body,created_at').order('created_at',{ascending:false}),
  sb.from('profiles').select('id,username,display_name,role,banned,last_seen').order('created_at'),
  sb.from('activity').select('user_id,kind,ref,created_at').order('created_at',{ascending:false}).limit(30)]);
 const U=u.data||[],N={};U.forEach(p=>N[p.id]=p.display_name+' (@'+p.username+')');
 $('#nlist').innerHTML=(n.data||[]).map(x=>`<div class="cm">${esc(x.body).replace(/\n/g,'<br>')}<div class="num">${ago(x.created_at)} <a data-k="dn" data-i="${x.id}">Delete</a></div></div>`).join('');
 const on=U.filter(p=>!p.banned&&Date.now()-new Date(p.last_seen)<120000);
 $('#onl').innerHTML=on.map(p=>`<div>\u25cf ${esc(p.display_name)} <span class="num">@${esc(p.username)}</span></div>`).join('')||'<span class="num">Nobody</span>';
 $('#ulist').innerHTML=U.filter(p=>p.role!=='owner').map(p=>`<div class="row" style="margin-bottom:8px"><div style="flex:1;min-width:0"><b>${esc(p.display_name)}</b><div class="num">@${esc(p.username)}${p.banned?' \u00b7 blocked':''}</div></div><button class="chip" data-k="ban" data-i="${p.id}" data-b="${p.banned?0:1}">${p.banned?'Unblock':'Kick'}</button><button class="chip" data-k="rs" data-i="${p.id}">Free name</button></div>`).join('')||'<span class="num">No users yet</span>';
 const K={signin:'signed in',like:'liked',comment:'commented on',message:'sent a DM',file:'got the file of'};
 $('#alist').innerHTML=(a.data||[]).map(x=>`<div class="cm">${esc(N[x.user_id]||'?')} ${K[x.kind]||esc(x.kind)}${x.ref?' post no. '+esc(x.ref):''} <span class="num">${ago(x.created_at)}</span></div>`).join('')||'<span class="num">Nothing yet</span>'}
$('#p3').onclick=async e=>{const t=e.target.closest('[data-k],#nb');if(!t)return;
 if(t.id==='nb'){const v=$('#nt').value.trim();if(!v)return;const r=await sb.from('notices').insert({body:v});if(!r.error)$('#nt').value=''}
 else if(t.dataset.k==='dn'){if(!confirm('Delete this notice?'))return;await sb.from('notices').delete().eq('id',+t.dataset.i)}
 else if(t.dataset.k==='ban'){const ban=t.dataset.b==='1';if(ban&&!confirm('Kick this user?'))return;await sb.rpc('set_banned',{p_uid:t.dataset.i,p_banned:ban})}
 else if(t.dataset.k==='rs'){if(!confirm('Free this username so it can be claimed again?'))return;await sb.rpc('reset_username',{p_uid:t.dataset.i})}
 noti()};
setInterval(()=>{if($('#p3').classList.contains('on'))noti()},15000);

boot();
</script></body></html>
